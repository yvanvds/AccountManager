name: account_manager
description: Arcadia Account Manager — Flutter Windows desktop app.
publish_to: 'none'
# A bare X.Y.Z — no `+N` build number (#440). Nothing reads one; see
# docs/release-process.md → "There is no build number".
version: 1.6.0

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # The orchestration layer (re-exports the lower pure-Dart packages).
  # Bare version: resolved through the root workspace.
  account_state:

  # Directly-imported lower layers of the reconcile screen: the domain types
  # (ILog, Origin, linked records), the action engine (dry-run/apply), and the
  # WISA + Smartschool connectors the bootstrap wires up.
  account_core:
  account_actions:
  wisa_api:
  smartschool_api:

  # The late-arrival layer (#399). Pure Dart and path-less by design: the app
  # supplies the journal's on-disk location, which is what
  # `src/late_arrivals/file_journal_store.dart` does.
  late_arrivals:

  # The Graph connector: needed here for the auth seam types the sign-in layer
  # implements (AzureAuthProvider, AzureCredentials, TokenCache).
  azure_api:

  # Smartschool's *internal* Presence module (#404). The public API this repo's
  # `smartschool_api` package speaks cannot write a presence at all; only the
  # internal `Presence/Class/savePupilsPresences` endpoint can, and this library
  # already implements it (repo `yvanvds/dartschool`).
  #
  # The hosted release, pinned exactly (#468). Until 0.3.7 this was a git
  # dependency pinned to a dartschool commit, because pub.dev lagged behind:
  # `PresenceService` first appeared in 0.2.9 while pub.dev was at 0.2.6, and
  # the fixes the Te laat drain was waiting for landed on dartschool's `main`
  # before any release carried them. 0.3.7 is on pub.dev and carries all of
  # them, so it comes from there. No caret: the root `pubspec.lock` is not
  # committed, so `^0.3.7` would let CI or a fresh clone resolve a newer 0.3.x
  # that nobody read. A new version is a deliberate bump of this line, with what
  # it brings written below. (0.3.6 has the same code, but pub.dev refused it
  # over a CHANGELOG.md of more than 256 KB; it was never published.)
  #
  # 0.3.7 (dartschool `ec7cc38`, tag `v0.3.7`), taken for dartschool#143 (#468).
  # A Presence answer with an HTTP status outside 200–299 and a body that *is*
  # valid JSON — a `500` with `{"message": "Internal Server Error"}`, from
  # Smartschool or a proxy — was read as the module's answer. A `getConfig`
  # answered that way gave a config without classes (and cached it), so the save
  # failed as a class "not among the classes this account may record presences
  # for": a plain `SmartschoolPresenceError`, which `classifyPresenceFailure`
  # makes a `PresenceRejected`, and the drain gave the registration up at once
  # as *mislukt*. A save answered that way read as one that went through. Now
  # such an answer is a `SmartschoolPresenceUnreadableAnswerError` of the new
  # kind `PresenceUnreadableAnswerKind.errorStatus` (last in the enum, with
  # `statusCode` and `path` set), nothing is cached from it, and the drain
  # retries it like the other unreadable answers (#461);
  # `describePresenceFailure` has Dutch words for it. One answer stays a refusal
  # whatever its status: a save answered with the module's own non-empty
  # `errors[]` is still a plain `SmartschoolPresenceError` with `saveErrors`, a
  # `PresenceRejected`.
  #
  # The same jump brings dartschool#140: `ensureAuthenticated()` now sends its
  # session check (`GET /course-list/api/v1/courses`) on every call, where it
  # sent nothing once the client had cached its platform ID. Both callers here,
  # `LiveSmartschoolPresenceSession.signIn` and **Aanmelding testen**, call it
  # once on a client they have just made, whose first call sent that request
  # before too, so nothing changes for them. The rest of the jump
  # (dartschool#141, the Messages archive folder; the 0.3.6 and 0.3.7 release
  # commits) is in nothing this app calls. dartschool#137 and #134, which the
  # pin before took from `main`, are in this release too.
  #
  # 31aac4c (the `main` merge of dartschool PR #142, past 0.3.5, the pin
  # before): the first pin past dartschool#137, which is why it was taken
  # (#461). An answer of the Presence module that cannot be read — an empty
  # body, an HTML page where JSON belongs, JSON that breaks off — now arrives
  # as its own `SmartschoolPresenceUnreadableAnswerError`, still a
  # `SmartschoolPresenceError`, carrying the endpoint, the HTTP status and what
  # made it unreadable. Before, it was a plain `SmartschoolPresenceError` that
  # only its message told apart from a refused save, so a proxy's 502 read as
  # a refusal and the drain gave the registration up at once. Now
  # `classifyPresenceFailure` tells it apart by type and retries it.
  #
  # The same jump brings dartschool#134: once Smartschool refused the session,
  # the client logs in before its next request instead of sending it into the
  # refused session first. The Presence requests are retried after a login
  # anyway, so for the drain this only saves a refused round trip: a failed
  # login still throws an authentication or a connection error, a request
  # refused after that login is still a `SmartschoolSessionExpiredError`, and
  # `LiveSmartschoolPresenceSession.signIn` still replaces the whole client.
  # The rest of the jump (dartschool#132, #133, #135, #136, #138: Intradesk,
  # lesson content, message folders) is in nothing this app calls.
  #
  # 0.3.5 (the `main` merge of that release, a git pin too): the first pin
  # past the fix for dartschool#21, taken for it (#455). Since that fix a request
  # that cannot reach Smartschool at all — the host does not resolve, the
  # connection drops or times out, the TLS handshake fails — throws
  # `SmartschoolConnectionError` with the `DioException` as its `cause`,
  # deliberately *not* a `SmartschoolAuthenticationError`. On 0.2.10 every one
  # of those came out of `ensureAuthenticated()` as an authentication error, so
  # a certificate the PC did not trust (#454) read as a wrong password under
  # **Aanmelding testen**, and the drain spent its re-authentications on a
  # network that was simply down. The 302-after-login fix the previous pin was
  # taken for (dartschool#6, #432) is in every later commit, this one included.
  #
  # That jump also brought the typed errors the Te laat layer matches on
  # instead of on message text: `SmartschoolSessionExpiredError` (dartschool#5,
  # which `smartschool_presence_writer.dart` used to approximate by reading the
  # "HTML instead of JSON" sentence), the `SmartschoolPresenceError` subtypes,
  # the login cooldown after three failed logins (dartschool#32) and
  # `SmartschoolClient.dispose()`.
  flutter_smartschool: 0.3.7

  # For the interactive loopback fallback's injectable HTTP client (the token
  # endpoint), shared with the OAuthAuthProvider reused from azure_api.
  http: ^1.2.0

  # The loopback broker's silent leg redeems the held refresh token for
  # another resource's scopes (oauth2.Credentials.refresh with newScopes).
  oauth2: ^2.0.0

  # FFI helpers (malloc, Utf16) for the DPAPI cipher that encrypts the
  # persisted token cache at rest (#103).
  ffi: ^2.1.0

  # The running build's own version (#371), read from the Windows executable's
  # version resource — which Flutter populates from the `version:` field above.
  # That keeps this file the single source of truth: the installer, the release
  # tag and the number the app shows itself all derive from it.
  package_info_plus: ^8.0.0

  # Semantic-version ordering for the update check (#371). Hand-rolling the
  # comparison is where an update check quietly starts offering 1.0.10 as older
  # than 1.0.9; this is the Dart team's own parser, pure Dart, already in the
  # lock file as a transitive dependency.
  pub_semver: ^2.1.0

  # Password sheets render as real PDFs (#195). `pdf` is pure Dart: no platform
  # plugin, so nothing to register in the Windows CMake build, and it runs
  # headlessly under `flutter test` — which is why the sheet bytes are asserted
  # directly in unit tests. The sibling `printing` plugin (native Windows code,
  # its own print dialog) is deliberately NOT pulled in: the export opens in the
  # platform's default PDF viewer through a plain `Process.start` instead.
  pdf: ^3.11.0

  # Plink Labs design system — Flutter binding, external to this workspace
  # (not on pub.dev). Consumed as a git dependency so it resolves everywhere
  # (CI + fresh clones), pinned to a commit for reproducibility. To hack on the
  # design system locally, add a path override in dependency_overrides.
  plink_design_system:
    git:
      url: https://github.com/plinklabs/plink-design-system.git
      path: bindings/flutter
      ref: 527e2dc0e350b1a21b78d6cefcfd847c16e9f501

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # The HTTP client under `flutter_smartschool` (#468), for one test fake:
  # `test/late_arrivals/fake_presence_module.dart` is the `dio` adapter of a
  # real `SmartschoolClient`, so the library's own `PresenceService` reads the
  # answers and throws its own errors, where the other fakes build those errors
  # by hand. The drain's retry policy rests on which type the library throws for
  # which answer, and a bump of the library can move that (dartschool#143 did).
  # The library's own constraint, so this resolves the version the app runs on.
  dio: ^5.7.0

flutter:
  uses-material-design: true
