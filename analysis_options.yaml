include: package:lints/recommended.yaml

analyzer:
  # Written and re-written by the Flutter tool's AnalysisOptionsMigration
  # unless all seven patterns are present verbatim (#415). `flutter analyze`
  # from the repo root runs that migration against THIS file — the workspace
  # root is the Flutter project root — so committing the block is what makes
  # the file stable; scoping the paths to `account_manager/...` would not
  # satisfy the migration and the bare patterns would come back.
  #
  # Confirmed to narrow nothing: no android/ ios/ web/ macos/ linux/ directory
  # exists anywhere in the workspace, and every build/ directory is generated
  # output (gitignored, zero .dart files). account_manager/ includes this file
  # (#418) but keeps an identical block of its own; either way the patterns
  # resolve against the options file in effect for that context root, so there
  # `windows/**` means account_manager/windows/** — the C++ runner, which holds
  # no Dart to analyse.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - avoid_print
    # require_trailing_commas is intentionally absent: since the tall-style
    # formatter (Dart 3.7+) trailing-comma placement is owned by dart format,
    # and the lint conflicts with its output (#58).
