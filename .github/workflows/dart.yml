# Dart CI for the wisa_api package (and any future workspace package).
#
# Two jobs:
#   - test       : offline `dart format` check + `dart analyze` + `dart test`.
#                  Always runs.
#   - live-test  : opt-in WISA + Smartschool + Azure integration tests
#                  (each package's `test/integration/`, all read-only).
#                  Gated to this repository so fork PRs cannot trigger
#                  secret access — fork pull_request runs do not expose
#                  secrets anyway, the gate is belt-and-suspenders.
#
# Operator setup for live-test (one-time):
#   WISA + Smartschool authenticate with stored read-only credentials, kept
#   as repository secrets:
#     WISA:        WISA_SERVER, WISA_PORT, WISA_DATABASE,
#                  WISA_USERNAME, WISA_PASSWORD, WISA_SCHOOL_ID
#                  Optional repository *variable* WISA_WERKDATUM (ISO date,
#                  not a secret) pins the export Werkdatum; when unset the
#                  live test defaults to 30 June of the current year so the
#                  export is non-empty in summer too (#57).
#     Smartschool: SMARTSCHOOL_SITE, SMARTSCHOOL_ACCESSCODE
#   Azure uses OIDC workload-identity federation — NO token or secret is
#   stored. A short-lived bearer token expires in ~1h, so storing one is
#   pointless; instead a fresh read-only Graph token is minted per run via
#   `azure/login` + `az account get-access-token`. Provide:
#     AZURE_CLIENT_ID, AZURE_TENANT_ID  — the federated read-only app (these
#                                         are identifiers, not secrets)
#     AZURE_DOMAIN, AZURE_SCHOOL_PREFIX — tenant config for the read filter
#   One-time Azure setup — an app registration with User.Read.All +
#   Group.Read.All *application* permissions (admin-consented) and a
#   federated credential trusting this repo — is documented in
#   packages/azure_api/README.md.
#   See each package's README.md and the matching .<name>.env.example at the
#   repo root for the variable meanings. Per the live-testing policy, every
#   credential is read-only — CI live tests never write.
#
# Overlap note: an older workflow (`ci.yml`) also runs `dart analyze` +
# `dart test` on pull_request, plus coverage / SonarCloud. The two
# workflows are kept side-by-side for now; consolidation is a follow-up.
#
# Action pinning: every JavaScript action here must run on Node 24 — Node 20
# is deprecated and only shimmed for now (#219). When bumping a pin, check the
# action's own `runs.using`, not just its major: `actions/checkout` reached
# node24 at v5, `azure/login` at v3. These need runner >= 2.327.1; the
# GitHub-hosted ubuntu-latest / windows-latest runners are well past that.
# `subosito/flutter-action@v2` is a *composite* action (bash steps only), so
# it has no Node runtime and is unaffected by the deprecation.

name: Dart

on:
  # Run on PRs (feature branches) and on direct pushes to the mainline
  # branches only. Without the branch filter, a feature branch with an open
  # PR runs every job twice — once for its `push` event and once for the
  # `pull_request` event. Pre-merge quality gates run on the PR; the
  # mainline `push` runs act as post-merge canaries.
  push:
    branches: [develop, master]
  pull_request:

# A newer commit on the same ref cancels an in-progress run, so a quick
# follow-up push doesn't pile up redundant live-integration runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Analyze + test (offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The workspace now includes the Flutter app (account_manager), so the
      # root resolves with the Flutter SDK, not bare Dart. Flutter bundles
      # Dart, so `dart format/analyze/test` below are unchanged — only the SDK
      # setup and `pub get` switch to Flutter.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: dart format (check only)
        # Must run AFTER pub get: since Dart 3.7 the formatter styles each
        # file by its package's language version, resolved via
        # package_config.json. Without it the formatter falls back to the
        # SDK-default style and flags spurious diffs (#58).
        run: dart format --output=none --set-exit-if-changed .

      - name: dart analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: dart test
        # Dart workspaces don't auto-discover tests from the root; the shell
        # glob expands to every workspace package's test/ directory, so new
        # packages are picked up automatically (#60 — a hand-maintained list
        # silently skipped account_store).
        # No WISA_USERNAME / SMARTSCHOOL_ACCESSCODE / AZURE_ACCESS_TOKEN in
        # this job — the integration tests self-skip, see each package's
        # test/integration/.
        run: dart test packages/*/test

      - name: flutter test (account_manager widget tests)
        # The Flutter app's own tests aren't picked up by the packages/* glob
        # above; its widget tests run headless on any platform. The Windows
        # end-to-end integration test runs in the separate app-integration job.
        working-directory: account_manager
        run: flutter test

  live-test:
    name: WISA + Smartschool + Azure live integration
    needs: test
    runs-on: ubuntu-latest
    # Only run on the canonical repo. Fork PRs do not get secrets even
    # without this gate, but skipping the job outright keeps the build
    # matrix tidy.
    if: github.repository == 'yvanvds/AccountManager'
    permissions:
      # OIDC: let the runner request a federated identity token so
      # azure/login can mint a read-only Graph token — nothing is stored.
      id-token: write
      contents: read
    env:
      WISA_SERVER: ${{ secrets.WISA_SERVER }}
      WISA_PORT: ${{ secrets.WISA_PORT }}
      WISA_DATABASE: ${{ secrets.WISA_DATABASE }}
      WISA_USERNAME: ${{ secrets.WISA_USERNAME }}
      WISA_PASSWORD: ${{ secrets.WISA_PASSWORD }}
      WISA_SCHOOL_ID: ${{ secrets.WISA_SCHOOL_ID }}
      # Optional; a plain date, so a repository variable rather than a
      # secret. Empty when unconfigured — the live test then defaults to
      # 30 June of the current year.
      WISA_WERKDATUM: ${{ vars.WISA_WERKDATUM }}
      SMARTSCHOOL_SITE: ${{ secrets.SMARTSCHOOL_SITE }}
      SMARTSCHOOL_ACCESSCODE: ${{ secrets.SMARTSCHOOL_ACCESSCODE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_DOMAIN: ${{ secrets.AZURE_DOMAIN }}
      AZURE_SCHOOL_PREFIX: ${{ secrets.AZURE_SCHOOL_PREFIX }}
      # AZURE_ACCESS_TOKEN is intentionally absent: it is minted at runtime
      # by the steps below (OIDC), never stored as a secret.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Flutter SDK (bundles Dart) — the workspace root now includes the
      # Flutter app, so it resolves with `flutter pub get`.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # --- Azure: mint a fresh read-only Graph token via OIDC ---
      # Gated on AZURE_CLIENT_ID so the job still runs (and the Azure test
      # self-skips) if the Azure secrets are ever cleared. Also gated to the
      # refs we created federated credentials for — pull requests and the
      # `develop` branch; on any other ref these steps skip and the Azure test
      # self-skips on the empty token. The federated app (AccountManager-CI-
      # ReadOnly) holds only User.Read.All + Group.Read.All, so the minted
      # token cannot write — the read-only guarantee is at the credential
      # layer, per the live-testing policy.
      - name: Azure login (OIDC — no stored secret)
        if: env.AZURE_CLIENT_ID != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop')
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Mint read-only Graph token
        if: env.AZURE_CLIENT_ID != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop')
        run: |
          token=$(az account get-access-token \
            --resource https://graph.microsoft.com \
            --query accessToken -o tsv)
          echo "::add-mask::$token"
          echo "AZURE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run live integration tests
        # If the credentials are unset (secrets not configured yet) the
        # tests self-skip and this still passes — by design, so the
        # workflow can land before secrets are provisioned. The Smartschool
        # and Azure live tests are read-only (sync only); see the
        # live-testing policy.
        run: dart test packages/wisa_api/test/integration/ packages/smartschool_api/test/integration/ packages/azure_api/test/integration/

  app-integration:
    name: account_manager Windows integration test
    needs: test
    # The Flutter app is Windows-only; its end-to-end launch test builds and
    # runs the real .exe, so it needs a Windows runner (the offline `test` job
    # above runs only the headless widget tests). No secrets — safe on forks.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter test (integration, Windows)
        working-directory: account_manager
        run: flutter test integration_test -d windows
