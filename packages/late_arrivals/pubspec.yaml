name: late_arrivals
description: >-
  Late-arrival (te-laatregistratie) support for the Arcadia Account Manager
  port. Turns a code scanned at the reception desk into the student the
  operator sees and the Smartschool Presence target a registration needs,
  entirely from state already in memory, journals that registration durably
  before the ticket prints, and mirrors the day's queue to the shared store so
  it survives the loss of the machine that made it. Pure Dart; no Flutter, no
  network, and no path of its own — the journal's files and the shared copies
  both live behind injected seams.
version: 0.1.0
publish_to: none
repository: https://github.com/yvanvds/AccountManager

# License: GPL-3.0-or-later. See LICENSE.

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  account_core:
  # The scan index is built from a `SmartschoolSnapshot`: it is the only place
  # that carries both `accountId` (the scanned WISA id, by operator convention)
  # and `referenceIdentifier` → `internalUserId`, which the materialized
  # per-account documents do not carry at all (#400).
  smartschool_api:

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
