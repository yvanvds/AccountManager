name: account_state
description: >-
  Layer-5 orchestration package for the Arcadia Account Manager port. Defines
  the persistence seams (settings, PersonId resolution, password queue) that
  the sync/link/apply orchestration plugs into, with in-memory and file-backed
  defaults so the layer is testable headlessly.
version: 0.1.0
publish_to: none
repository: https://github.com/yvanvds/AccountManager

# License: GPL-3.0-or-later. See LICENSE.

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  account_core:
  account_store:
  # SHA-256 for the per-document content hash the Cosmos materialized-view
  # write compares against the stored one, so an unchanged document is not
  # rewritten (#200). Pure Dart (Dart team package), no platform crypto.
  crypto: ^3.0.0
  http: ^1.2.0
  wisa_api:
  smartschool_api:
  azure_api:
  account_linker:
  account_actions:
  uuid: ^4.5.0
  # The pure-Dart WebSocket client backing the live SignalR subscriber (#124):
  # the negotiate handshake and message framing are handled in-package; this
  # only opens the socket. No Flutter dependency.
  web_socket_channel: ^3.0.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
