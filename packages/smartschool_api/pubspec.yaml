name: smartschool_api
description: >-
  Smartschool SOAP (V3) connector for the Arcadia Account Manager port.
  Reads the group tree and student/staff/co-account records, and performs
  the account, password, group, and membership writes the legacy action
  set depends on. Pure Dart, headless-testable.
version: 0.1.0
publish_to: none
repository: https://github.com/yvanvds/AccountManager

# License: GPL-3.0-or-later. See LICENSE.

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  account_core:
  http: ^1.2.0
  xml: ^6.5.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
